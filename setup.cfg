[bdist_wheel]
universal = 0

[check-manifest]
ignore =
    *.cfg
    .dockerignore
    Makefile
    prepare.sh
    zc.recipe.egg_/*
    zc.recipe.egg_
    .github/*
    .github
    .goose/**
    dagger/**
    dagger.json
    devenv.lock
    devenv.nix
    devenv.yaml
    etc/**
    mutation-testing/**
    PLAN_UV_DEP_REMOVAL.md
    uv.lock

[zest.releaser]
create-wheel = yes
extra-message = [ci skip]
