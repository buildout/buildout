[tool.ty.src]
# _vendor is frozen third-party code (the pkg_resources v81 fork):
# not gateable signal, excluded from the static tier.
# etc/tracing is a MonkeyType driver used with an ad-hoc monkeytype
# install; the gate venv intentionally lacks it.
# dagger is a Dagger SDK module (own pyproject, generated sdk/ dir);
# the repo venv has no dagger-io to check it against. It is verified
# by running it (dagger call), not statically.
exclude = ["src/zc/buildout/_vendor", "etc/tracing", "dagger"]

[tool.mypy]
# Explicit-Any burndown gate (make typecheck-any; separate from the ty
# static tier, which has no Any rule). mypy is devenv-provided, and the
# dagger static cell pip-installs the same version, so the local gate
# and CI agree by construction. python_version
# matches the support floor (setup.py python_requires >=3.9). mypy maps
# this src layout to `buildout.*` module names (src/zc has no
# __init__.py), so the overrides below use those names.
python_version = "3.9"
ignore_missing_imports = true
disallow_any_explicit = true

[[tool.mypy.overrides]]
module = "buildout._package_index"
# The uv migration deletes this module; out of the burndown scope.
disallow_any_explicit = false

[[tool.mypy.overrides]]
module = "buildout.tests.*"
# Test code stays out of the burndown scope.
disallow_any_explicit = false

[tool.pytest.ini_options]
# src/zc is a namespace package (no __init__.py). Without this, pytest's
# default import mode walks up only to zc/buildout and imports the ported
# test modules as buildout.tests.*: a second, alias copy of the package
# next to the real zc.buildout.* one, which also defeats name-based
# coverage matching (source = zc.buildout).
consider_namespace_packages = true

[tool.ruff]
# The repo supports Python 3.9+ (setup.py python_requires).
target-version = "py39"

[tool.ruff.lint]
# The burndown end state: the wide set the tree is burned clean against,
# explicit by rule code so `make lint` means the same thing across ruff
# versions. The ignore list is empty; deliberate patterns carry scoped
# noqa comments with reasons, and the per-file-ignores below carry the
# remaining boundary (probes, re-exports, load-bearing import order).
select = [
    # The classic ruff default set, enforced since the phase 1-3 burndown.
    "E4", "E7", "E9", "F",
    # Import sorting (the load-bearing dances are per-file-ignored below).
    "I001",
    # pyupgrade, py39 floor
    "UP004", "UP006", "UP007", "UP008", "UP009", "UP010", "UP012",
    "UP024", "UP030", "UP031", "UP032", "UP034", "UP035", "UP037", "UP045",
    # Comprehensions
    "C402", "C404", "C408",
    # flake8-blind-except
    "BLE001",
    # flake8-bugbear judgment set
    "B006", "B010", "B015", "B018",
    # flake8-simplify judgment set
    "SIM102", "SIM114", "SIM115", "SIM117", "SIM118", "SIM905",
    # ruff's own judgment set
    "RUF012", "RUF015", "RUF022", "RUF051", "RUF059", "RUF100",
    # misc judgment sets
    "PIE790", "PIE810",
    "FURB129", "FURB167", "FURB188",
    "YTT204", "T100", "S110", "DTZ005", "EXE001",
    "PLE0704", "PLW1510", "PLR1704", "PLC0206", "TRY002",
    # f-string conversion
    "FLY002",
]
ignore = []

[tool.ruff.lint.isort]
# The local `build/` tree (created by prepare.sh's sdist step, gitignored
# and absent from clean checkouts and CI mounts) would otherwise flip the
# `build` package between first-party and third-party depending on the
# machine state. Pin it so I001 means the same thing everywhere.
known-third-party = ["build"]

[tool.ruff.lint.per-file-ignores]
# Ported doctest writes a buildout.cfg containing `${...}` substitutions
# and applies `% dict` for legacy reasons; a mapping argument with no
# %-placeholder is a deliberate no-op, not a bug.
"src/zc/buildout/tests/pytests/test_pytest_buildout_doctests.py" = ["F507"]
# Deliberate unused imports: import-availability probes in try/except
# and public re-exports. __init__.py also has load-bearing import
# order (do-not-reorder comment in the file): the distutils-hack
# finder removal before the pip import, warning filters before the
# pkg_resources deprecation surfaces.
"src/zc/buildout/__init__.py" = ["F401", "E402", "I001"]
"src/zc/buildout/buildout.py" = ["F401"]
"src/zc/buildout/easy_install.py" = ["F401"]
"src/zc/buildout/install_backend.py" = ["F401"]
"src/zc/buildout/patches.py" = ["F401"]
"zc.recipe.egg_/src/zc/recipe/egg/__init__.py" = ["F401"]
# Packaging entry point: name and version assignments ahead of the
# setuptools import.
"setup.py" = ["E402"]
# Packaging entry point: name and version assignments ahead of the
# setuptools import.
"zc.recipe.egg_/setup.py" = ["E402"]
# Puts its own directory on sys.path to import the sibling gen_pytest
# module as a script.
"src/zc/buildout/tests/pytests/inject_prose.py" = ["E402"]
# Deliberate late import after pkg_resources.working_set.add_entry;
# the file carries an isort do-not-move note on that line.
"dev.py" = ["E402"]

[tool.towncrier]
filename = "CHANGES.rst"
directory = "news/"
title_format = "{version} ({project_date})"
underlines = ["-", ""]

[[tool.towncrier.type]]
directory = "breaking"
name = "Breaking changes:"
showcontent = true

[[tool.towncrier.type]]
directory = "feature"
name = "New features:"
showcontent = true

[[tool.towncrier.type]]
directory = "bugfix"
name = "Bug fixes:"
showcontent = true

[[tool.towncrier.type]]
directory = "develop"
name = "Development:"
showcontent = true

[[tool.towncrier.type]]
directory = "tests"
name = "Tests:"
showcontent = true
