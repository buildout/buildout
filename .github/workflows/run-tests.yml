name: Run tests

on:
  push:
    # The windows-iter scratch branch is the fast iteration loop
    # (windows-iter.yml): the full matrix must not run there.
    branches-ignore: [windows-iter]
  pull_request:
  # Allow to run this workflow manually from the Actions tab
  workflow_dispatch:

# Tool provisioning philosophy: GitHub actions only bootstrap the
# repo's own development environment (Nix + the devenv CLI, via the
# repo-owned composite action in .github/actions/devenv-setup). Every
# development tool — Python 3.9-3.14 (selected per job with
# `devenv shell --option languages.python.version:string`), uv, ruff,
# ty, radon, make — comes from devenv.nix, so CI runs the same toolchain a
# local developer shell provides, pinned by devenv.lock.
# Exception: the Windows job (windows.yml) keeps actions/setup-python
# because Nix does not run on Windows runners.
# Second exception: the dagger job takes its dagger CLI from
# dagger/dagger-for-github, pinned to dagger.json's engineVersion.
# The devenv-provided CLI would need _EXPERIMENTAL_DAGGER_RUNNER_HOST
# unset (it points at the local podman machine; runners only have
# docker), and a full Nix bootstrap would only deliver that one Go
# binary. The engine self-provisions as a container on the runner's
# docker daemon.

jobs:
  setuptools:
    name: setuptools ${{ matrix.setuptools-version}}
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python-version: ["3.10"]
        setuptools-version: ["63.0.0", "65.7.0", "69.5.1", "74.1.3", "75.9.1", "79.0.1", "80.2.0", "80.10.2", "81.0.0"]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v6.0.2
    - uses: ./.github/actions/devenv-setup
      with:
        # Project cachix cache (optional): set the CACHIX_CACHE_NAME
        # variable and CACHIX_AUTH_TOKEN secret to activate; both empty
        # means this step is skipped entirely.
        cachix-cache: ${{ vars.CACHIX_CACHE_NAME }}
        cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
    - name: Run tests
      env:
        # When you install packages, you see far too many setuptools warnings.
        # They drown out useful output, so ignore all warnings.
        PYTHONWARNINGS: ignore
        SETUPTOOLS_VERSION: ${{matrix.setuptools-version}}
      run: >-
        devenv shell
        --option languages.python.version:string "${{matrix.python-version}}"
        -- make
    - name: Run pytest suite
      if: matrix.setuptools-version != '63.0.0'
      env:
        PYTHONWARNINGS: ignore
        SETUPTOOLS_VERSION: ${{matrix.setuptools-version}}
      run: >-
        devenv shell
        --option languages.python.version:string "${{matrix.python-version}}"
        -- make pytest

  lint:
    # Static hygiene gate, parallel to the test matrix: ruff needs no
    # bootstrap. It comes from the devenv, so CI and local `make lint`
    # agree by construction (rule selection: [tool.ruff] in
    # pyproject.toml).
    name: ruff
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6.0.2
    - uses: ./.github/actions/devenv-setup
      with:
        # Project cachix cache (optional): set the CACHIX_CACHE_NAME
        # variable and CACHIX_AUTH_TOKEN secret to activate; both empty
        # means this step is skipped entirely.
        cachix-cache: ${{ vars.CACHIX_CACHE_NAME }}
        cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
    - name: Run ruff
      run: devenv shell -- make lint

  complexity:
    # Complexity budget gate, parallel to the test matrix like ruff:
    # radon needs no bootstrap and comes from the devenv, so CI and a
    # local `make complexity` agree by construction (baseline:
    # etc/complexity-baseline.json; gate script: etc/complexity_gate.py).
    name: radon
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6.0.2
    - uses: ./.github/actions/devenv-setup
      with:
        # Project cachix cache (optional): set the CACHIX_CACHE_NAME
        # variable and CACHIX_AUTH_TOKEN secret to activate; both empty
        # means this step is skipped entirely.
        cachix-cache: ${{ vars.CACHIX_CACHE_NAME }}
        cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
    - name: Run complexity gate
      run: devenv shell -- make complexity

  typecheck:
    # Static tier, parallel to the test matrix. `make typecheck`
    # bootstraps bin/test first: the buildout run materializes eggs/,
    # which ty needs on its search path to resolve imports.
    # ty comes from the devenv, and the devenv exports the
    # PYTHON_VERSION / SETUPTOOLS_VERSION pins the bootstrap needs.
    name: ty
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6.0.2
    - uses: ./.github/actions/devenv-setup
      with:
        # Project cachix cache (optional): set the CACHIX_CACHE_NAME
        # variable and CACHIX_AUTH_TOKEN secret to activate; both empty
        # means this step is skipped entirely.
        cachix-cache: ${{ vars.CACHIX_CACHE_NAME }}
        cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
    - name: Run ty
      env:
        PYTHONWARNINGS: ignore
      run: devenv shell -- make typecheck

  typecheck-any:
    # Explicit-Any burndown gate, parallel to the test matrix like ruff:
    # mypy needs no bootstrap and comes from the devenv, so CI and a
    # local `make typecheck-any` agree by construction (config:
    # [tool.mypy] in pyproject.toml; baseline etc/any-burndown-baseline.txt;
    # gate script: etc/check_any_burndown.sh).
    name: mypy
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6.0.2
    - uses: ./.github/actions/devenv-setup
      with:
        # Project cachix cache (optional): set the CACHIX_CACHE_NAME
        # variable and CACHIX_AUTH_TOKEN secret to activate; both empty
        # means this step is skipped entirely.
        cachix-cache: ${{ vars.CACHIX_CACHE_NAME }}
        cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
    - name: Run mypy
      run: devenv shell -- make typecheck-any

  setuptools61:
    # setuptools 61 is much slower, so we do not run all tests on it.
    name: setuptools 61
    needs: setuptools
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python-version: ["3.10"]
        setuptools-version: ["61.0.0"]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v6.0.2
    - uses: ./.github/actions/devenv-setup
      with:
        # Project cachix cache (optional): set the CACHIX_CACHE_NAME
        # variable and CACHIX_AUTH_TOKEN secret to activate; both empty
        # means this step is skipped entirely.
        cachix-cache: ${{ vars.CACHIX_CACHE_NAME }}
        cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
    - name: Run tests
      env:
        PYTHONWARNINGS: ignore
        SETUPTOOLS_VERSION: ${{matrix.setuptools-version}}
      run: >-
        devenv shell
        --option languages.python.version:string "${{matrix.python-version}}"
        -- make test-small

  python:
    name: Python ${{ matrix.python-version}}
    needs: setuptools
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        # Skip "3.10" because it is already checked above.
        # Use the last setuptools version that is still supported by all Python versions.
        python-version: ["3.9", "3.11", "3.12", "3.13", "3.14"]
        setuptools-version: ["75.6.0"]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v6.0.2
    - uses: ./.github/actions/devenv-setup
      with:
        # Project cachix cache (optional): set the CACHIX_CACHE_NAME
        # variable and CACHIX_AUTH_TOKEN secret to activate; both empty
        # means this step is skipped entirely.
        cachix-cache: ${{ vars.CACHIX_CACHE_NAME }}
        cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
    - name: Run tests
      env:
        PYTHONWARNINGS: ignore
        SETUPTOOLS_VERSION: ${{matrix.setuptools-version}}
      run: >-
        devenv shell
        --option languages.python.version:string "${{matrix.python-version}}"
        -- make
    - name: Run pytest suite
      env:
        PYTHONWARNINGS: ignore
        SETUPTOOLS_VERSION: ${{matrix.setuptools-version}}
      run: >-
        devenv shell
        --option languages.python.version:string "${{matrix.python-version}}"
        -- make pytest

  pip:
    name: pip ${{ matrix.pip-version}} st ${{ matrix.setuptools-version}}
    needs: python
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python-version: ["3.10"]
        pip-version: ["21.3.1", "22.3.1", "23.3.2", "24.3.1", "25.3", "26.1.2", "26.2.1"]
        setuptools-version: ["65.7.0", "75.8.2"]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v6.0.2
    - uses: ./.github/actions/devenv-setup
      with:
        # Project cachix cache (optional): set the CACHIX_CACHE_NAME
        # variable and CACHIX_AUTH_TOKEN secret to activate; both empty
        # means this step is skipped entirely.
        cachix-cache: ${{ vars.CACHIX_CACHE_NAME }}
        cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
    - name: Run tests
      env:
        PYTHONWARNINGS: ignore
        PIP_VERSION: ${{matrix.pip-version}}
        SETUPTOOLS_VERSION: ${{matrix.setuptools-version}}
      run: >-
        devenv shell
        --option languages.python.version:string "${{matrix.python-version}}"
        -- make
    - name: Run pytest suite
      env:
        PYTHONWARNINGS: ignore
        PIP_VERSION: ${{matrix.pip-version}}
        SETUPTOOLS_VERSION: ${{matrix.setuptools-version}}
      run: >-
        devenv shell
        --option languages.python.version:string "${{matrix.python-version}}"
        -- make pytest

  mac:
    name: Mac
    needs: pip
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
        python-version: ["3.10"]
        setuptools-version: ["75.8.2"]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v6.0.2
    - uses: ./.github/actions/devenv-setup
      with:
        # Project cachix cache (optional): set the CACHIX_CACHE_NAME
        # variable and CACHIX_AUTH_TOKEN secret to activate; both empty
        # means this step is skipped entirely.
        cachix-cache: ${{ vars.CACHIX_CACHE_NAME }}
        cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
    - name: Run tests
      env:
        PYTHONWARNINGS: ignore
        SETUPTOOLS_VERSION: ${{matrix.setuptools-version}}
      run: >-
        devenv shell
        --option languages.python.version:string "${{matrix.python-version}}"
        -- make
    - name: Run pytest suite
      env:
        PYTHONWARNINGS: ignore
        SETUPTOOLS_VERSION: ${{matrix.setuptools-version}}
      run: >-
        devenv shell
        --option languages.python.version:string "${{matrix.python-version}}"
        -- make pytest

  windows:
    name: Windows
    # These tests are the slowest, so start them immediately after the first batch
    # of tests have finished, instead of after the both the Python and pip matrixes.
    needs: setuptools
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
    uses: ./.github/workflows/windows.yml

  coverage:
    # Coverage variant of the legacy suite, in parallel with the windows
    # job. make coverage runs bin/test under coverage (every spawned
    # interpreter traced via etc/coverage/sitecustomize.py on PYTHONPATH)
    # and finishes with bin/coverage combine/report/html. Python 3.12 via
    # the devenv; the devenv also exports the SETUPTOOLS_VERSION pin.
    name: coverage legacy
    needs: setuptools
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6.0.2
    - uses: ./.github/actions/devenv-setup
      with:
        # Project cachix cache (optional): set the CACHIX_CACHE_NAME
        # variable and CACHIX_AUTH_TOKEN secret to activate; both empty
        # means this step is skipped entirely.
        cachix-cache: ${{ vars.CACHIX_CACHE_NAME }}
        cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
    - name: Run legacy suite with coverage
      env:
        PYTHONWARNINGS: ignore
      run: >-
        devenv shell
        --option languages.python.version:string "3.12"
        -- make coverage
    - name: Upload HTML coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-legacy-html
        path: htmlcov/

  coverage-pytest:
    # Coverage variant of the pytest suite, in parallel with the windows
    # job. Same mechanism as the coverage job, over make coverage-pytest.
    name: coverage pytest
    needs: setuptools
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6.0.2
    - uses: ./.github/actions/devenv-setup
      with:
        # Project cachix cache (optional): set the CACHIX_CACHE_NAME
        # variable and CACHIX_AUTH_TOKEN secret to activate; both empty
        # means this step is skipped entirely.
        cachix-cache: ${{ vars.CACHIX_CACHE_NAME }}
        cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
    - name: Run pytest suite with coverage
      env:
        PYTHONWARNINGS: ignore
      run: >-
        devenv shell
        --option languages.python.version:string "3.12"
        -- make coverage-pytest
    - name: Upload HTML coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-pytest-html
        path: htmlcov/

  coverage-unittests:
    # Coverage over the unit tests only: the subset of the pytest suite
    # that takes no integration fixture from the pytests conftest
    # (make coverage-unittests passes --unittests-only). Same mechanism
    # as the coverage-pytest job, over that subset.
    name: coverage unittests
    needs: setuptools
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6.0.2
    - uses: ./.github/actions/devenv-setup
      with:
        # Project cachix cache (optional): set the CACHIX_CACHE_NAME
        # variable and CACHIX_AUTH_TOKEN secret to activate; both empty
        # means this step is skipped entirely.
        cachix-cache: ${{ vars.CACHIX_CACHE_NAME }}
        cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
    - name: Run unittests with coverage
      env:
        PYTHONWARNINGS: ignore
      run: >-
        devenv shell
        --option languages.python.version:string "3.12"
        -- make coverage-unittests
    - name: Upload HTML coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-unittests-html
        path: htmlcov/

  generate-scripts:
    name: Scripts Python ${{ matrix.python-version }}
    needs: pip
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
    strategy:
      matrix:
        package: [zest.releaser, pyspf]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        os: ["ubuntu-22.04"]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v6.0.2
    - uses: ./.github/actions/devenv-setup
      with:
        # Project cachix cache (optional): set the CACHIX_CACHE_NAME
        # variable and CACHIX_AUTH_TOKEN secret to activate; both empty
        # means this step is skipped entirely.
        cachix-cache: ${{ vars.CACHIX_CACHE_NAME }}
        cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
    - name: Setup buildout virtualenv
      run: >-
        devenv shell
        --option languages.python.version:string "${{matrix.python-version}}"
        -- make -f .github/workflows/Makefile-scripts sandbox/bin/buildout
    - name: Run buildout
      env:
        PYTHONWARNINGS: ignore
        PACKAGE: ${{matrix.package}}
        PYTHON_VERSION: ${{matrix.python-version}}
      run: |
        sandbox/bin/buildout -v -c .github/workflows/scripts-${PYTHON_VERSION}.cfg annotate buildout
        sandbox/bin/buildout -c .github/workflows/scripts-${PYTHON_VERSION}.cfg
    - name: Check eggs
      run: |
        ls -al sandbox/eggs
        ls -al sandbox/downloads/dist

  dagger:
    # The whole matrix above plus the test-uv.yml parallel set, run a
    # second time inside containers via
    # the repo's own dagger module (dagger.json, dagger/): same job
    # table, same make targets. This is the job a developer reproduces
    # locally with `dagger call ci`. The matrix below runs one GH job
    # per job family: the dagger module's FAMILIES plus the harness's
    # own module family (dagger/src/buildout_ci/jobs.py); the two lists
    # must stay in sync.
    name: dagger ${{ matrix.family }}
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        family: [setuptools, python, pip, scripts, static, coverage, uv, module]
    steps:
    - uses: actions/checkout@v6.0.2
    - name: Free runner disk
      # A full run keeps ~13 GB in the engine cache (base images plus
      # committed exec layers); runners ship ~14 GB free. Drop
      # preinstalled SDKs this job never uses (plain rm, no extra action).
      run: |
        sudo rm -rf /usr/local/lib/android /usr/share/dotnet \
          /usr/share/swift /opt/ghc /usr/local/.ghcup \
          /opt/hostedtoolcache /usr/local/julia* \
          /usr/local/share/powershell || true
        df -h /
    - uses: dagger/dagger-for-github@v8.4.1
      with:
        # Keep in sync with engineVersion in dagger.json.
        version: "0.21.9"
    - name: Run daggerized CI
      # plain progress: the default TTY rendering floods the log of a
      # multi-job family run.
      run: dagger --progress=plain call ci --family "${{ matrix.family }}" --concurrency 4
