name: Run tests

on:
  push:
  pull_request:
  # Allow to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  setuptools:
    name: setuptools ${{ matrix.setuptools-version}}
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python-version: ["3.10"]
        # 75.8.2 is our minimum.  The other versions mark behaviour
        # boundaries: 79.0.1 is the last one with 'setup.py develop',
        # 80.2.0 still has setuptools.command.easy_install (removed in
        # 80.3), 81.0.0 is the last one shipping pkg_resources and
        # 82.0.1 the first one without it (buildout uses its own
        # vendored copy on all versions).
        setuptools-version: ["75.8.2", "79.0.1", "80.2.0", "80.10.2", "81.0.0", "82.0.1", "83.0.0"]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v6.0.2
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6.2.0
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip' # caching pip dependencies
    - name: Run tests
      env:
        # When you install packages, you see far too many setuptools warnings.
        # They drown out useful output, so ignore all warnings.
        PYTHONWARNINGS: ignore
        PYTHON_VERSION: ${{matrix.python-version}}
        # PIP_VERSION: ${{matrix.pip-version}}
        SETUPTOOLS_VERSION: ${{matrix.setuptools-version}}
      run: make

  python:
    name: Python ${{ matrix.python-version}}
    needs: setuptools
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        # Skip "3.10" because it is already checked above.
        # The setuptools matrix above covers the version range, so here we
        # only use the newest setuptools, which supports every Python we test.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        setuptools-version: ["83.0.0"]
        include:
          # 3.9 is listed here and not above, because setuptools 82.0.1 is
          # the newest version supporting it.
          - os: ubuntu-24.04
            python-version: "3.9"
            setuptools-version: "82.0.1"
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v6.0.2
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6.2.0
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true
        cache: 'pip' # caching pip dependencies
    - name: Run tests
      env:
        PYTHONWARNINGS: ignore
        PYTHON_VERSION: ${{matrix.python-version}}
        # PIP_VERSION: ${{matrix.pip-version}}
        SETUPTOOLS_VERSION: ${{matrix.setuptools-version}}
      run: make

  pip:
    name: pip ${{ matrix.pip-version}} st ${{ matrix.setuptools-version}}
    needs: python
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python-version: ["3.10"]
        # Only the latest release of each year, so we do not go hunting for
        # bugs that pip fixed later in the same year.
        pip-version: ["25.3", "26.1.2"]
        setuptools-version: ["75.8.2", "83.0.0"]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v6.0.2
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6.2.0
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip' # caching pip dependencies
    - name: Run tests
      env:
        PYTHONWARNINGS: ignore
        PYTHON_VERSION: ${{matrix.python-version}}
        PIP_VERSION: ${{matrix.pip-version}}
        SETUPTOOLS_VERSION: ${{matrix.setuptools-version}}
      run: make

  mac:
    name: Mac
    needs: pip
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
        python-version: ["3.10"]
        setuptools-version: ["83.0.0"]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v6.0.2
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6.2.0
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip' # caching pip dependencies
    - name: Run tests
      env:
        PYTHONWARNINGS: ignore
        PYTHON_VERSION: ${{matrix.python-version}}
        # PIP_VERSION: ${{matrix.pip-version}}
        SETUPTOOLS_VERSION: ${{matrix.setuptools-version}}
      run: make

  windows:
    name: Windows
    # These tests are the slowest, so start them immediately after the first batch
    # of tests have finished, instead of after the both the Python and pip matrixes.
    needs: setuptools
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        python-version: ["3.10"]
        # The newest setuptools exercises the Windows script generation
        # (cli.exe) with a setuptools that no longer ships pkg_resources.
        setuptools-version: ["83.0.0"]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v6.0.2
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6.2.0
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip' # caching pip dependencies
    - name: Run tests
      env:
        PYTHONWARNINGS: ignore
        PYTHON_VERSION: ${{matrix.python-version}}
        # PIP_VERSION: ${{matrix.pip-version}}
        SETUPTOOLS_VERSION: ${{matrix.setuptools-version}}
        # Defining temporary directories is needed on Windows for
        # test_all.TestEasyInstall.test_move_to_eggs_dir_and_compile
        TMPDIR: C:\tmp
        TMP: C:\tmp
        TEMP: C:\tmp
      run: make

  generate-scripts:
    name: Scripts Python ${{ matrix.python-version }}
    needs: pip
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
    strategy:
      matrix:
        package: [zest.releaser, pyspf]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        os: ["ubuntu-22.04"]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v6.0.2
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6.2.0
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true
    - name: Setup buildout virtualenv
      run: |
        make -f .github/workflows/Makefile-scripts sandbox/bin/buildout
    - name: Run buildout
      env:
        PYTHONWARNINGS: ignore
        PACKAGE: ${{matrix.package}}
        PYTHON_VERSION: ${{matrix.python-version}}
      run: |
        sandbox/bin/buildout -v -c .github/workflows/scripts-${PYTHON_VERSION}.cfg annotate buildout
        sandbox/bin/buildout -c .github/workflows/scripts-${PYTHON_VERSION}.cfg
    - name: Check eggs
      run: |
        ls -al sandbox/eggs
        ls -al sandbox/downloads/dist
